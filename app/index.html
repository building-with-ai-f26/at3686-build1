<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Burst or Not</title>
  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --text: #111827;
      --muted: #4b5563;
      --border: #e5e7eb;
      --track: #e5e7eb;
      --fearful: #2563eb;
      --cautious: #0891b2;
      --neutral: #9ca3af;
      --hot: #f59e0b;
      --frothy: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #181b22;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --border: #2a2f3a;
        --track: #2a2f3a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
    .sub { margin: 4px 0 24px; color: var(--muted); }
    .gauge-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .gauge-card svg { width: 100%; max-width: 360px; height: auto; }
    #needle { transition: transform 0.8s ease-out; transform-origin: 150px 150px; }
    .score { font-size: 48px; font-weight: 700; line-height: 1; margin-top: 4px; }
    .band { font-size: 18px; font-weight: 600; margin-top: 4px; }
    .meta { font-size: 13px; color: var(--muted); }
    .signals { display: grid; gap: 12px; }
    details {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "▸"; color: var(--muted); }
    details[open] summary::after { content: "▾"; }
    .signal-name { font-weight: 600; }
    .signal-score { font-size: 22px; font-weight: 700; margin-left: auto; }
    .signal-body { margin-top: 10px; font-size: 14px; }
    .signal-body ul { padding-left: 18px; margin: 6px 0; }
    .note { font-size: 13px; color: var(--muted); font-style: italic; }
    a { color: var(--fearful); }
    footer { margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>Burst or Not</h1>
    <p class="sub">A 10-second read on AI froth. Not investment advice.</p>

    <section class="gauge-card" aria-live="polite">
      <svg viewBox="0 0 300 175" role="img" aria-label="Froth gauge from 0 Fearful to 100 Frothy">
        <g id="bands" fill="none" stroke-width="22"></g>
        <g id="needle">
          <line x1="150" y1="150" x2="40" y2="150" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
          <circle cx="150" cy="150" r="8" fill="currentColor" />
        </g>
        <text x="22" y="172" font-size="11" fill="currentColor">Fearful</text>
        <text x="278" y="172" font-size="11" fill="currentColor" text-anchor="end">Frothy</text>
      </svg>
      <div class="score" id="score">…</div>
      <div class="band" id="band">Loading signals</div>
      <div class="meta" id="coverage"></div>
    </section>

    <section class="signals" id="signals"></section>

    <footer class="meta">
      Live data: Polymarket and OpenRouter public APIs. Prototype scoring; the calm/frothy cutoffs are judgment calls.
    </footer>
  </main>

  <script>
    /*
     * SCORING FORMULA
     * ---------------
     * Each signal produces one raw value. We turn it into a 0–100 sub-score with
     * a straight line between a "calm" value (scores 0) and a "frothy" value
     * (scores 100), clamped so it never goes below 0 or above 100:
     *
     *     sub-score = clamp( (value − calm) / (frothy − calm) × 100, 0, 100 )
     *
     * The froth score is the plain average of the sub-scores that loaded
     * (equal weights). If a signal fails to load, it is skipped and the others
     * are averaged.
     *
     *   1. Polymarket hype odds: average "Yes" chance across three AI-hype
     *      markets. Calm = 5%, Frothy = 50%.
     *   2. OpenRouter price trend: median input price of paid models released
     *      in the last 90 days ÷ median for models released 90–365 days ago.
     *      Falling prices count as froth (labs pricing below cost to grab
     *      share). Calm = 1.2 (prices up 20%), Frothy = 0.6 (prices down 40%).
     *   3. Manual signal: AI's share of global VC funding, entered by hand each
     *      quarter from Crunchbase. Calm = 20%, Frothy = 80%.
     *
     * Bands: 0–20 Fearful · 20–40 Cautious · 40–60 Neutral · 60–80 Hot · 80–100 Frothy.
     * The cutoffs are prototype guesses, not calibrated against history.
     */

    // Update each quarter: set value (percent), quarter, and source, and add the
    // old value to history.
    const MANUAL_SIGNAL = {
      label: "AI share of global VC funding",
      value: 64,
      quarter: "Q3 2026",
      source: "Crunchbase",
      history: [
        { quarter: "Q1 2026", value: 80 },
        { quarter: "Q3 2025", value: 50, approx: true },
      ],
    };

    const POLYMARKET_MARKETS = [
      { slug: "will-anthropics-valuation-hit-high-2pt5t-by-december-31-169", event: "will-anthropics-valuation-hit-by-december-31" },
      { slug: "openai-ipo-closing-market-cap-above-2t", event: "openai-ipo-closing-market-cap-above" },
      { slug: "openai-announces-it-has-achieved-agi-before-2027", event: "openai-announces-it-has-achieved-agi-before-2027" },
    ];

    const BOUNDS = {
      polymarket: { calm: 0.05, frothy: 0.5 },
      openrouter: { calm: 1.2, frothy: 0.6 },
      manual: { calm: 20, frothy: 80 },
    };

    const BANDS = [
      { max: 20, name: "Fearful", color: "var(--fearful)" },
      { max: 40, name: "Cautious", color: "var(--cautious)" },
      { max: 60, name: "Neutral", color: "var(--neutral)" },
      { max: 80, name: "Hot", color: "var(--hot)" },
      { max: 100, name: "Frothy", color: "var(--frothy)" },
    ];

    const DAY_SECONDS = 86400;

    function subScore(value, { calm, frothy }) {
      const scaled = ((value - calm) / (frothy - calm)) * 100;
      return Math.max(0, Math.min(100, scaled));
    }

    function bandFor(score) {
      return BANDS.find((b) => score <= b.max) || BANDS[BANDS.length - 1];
    }

    function median(numbers) {
      const sorted = [...numbers].sort((a, b) => a - b);
      const mid = Math.floor(sorted.length / 2);
      return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function getJson(url) {
      const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    // Signal 1: Polymarket. Each market reports outcomes and prices as JSON strings.
    async function loadPolymarket() {
      const results = await Promise.allSettled(
        POLYMARKET_MARKETS.map(async ({ slug, event }) => {
          const [market] = await getJson(`https://gamma-api.polymarket.com/markets?slug=${slug}`);
          if (!market) throw new Error("market not found");
          const outcomes = JSON.parse(market.outcomes);
          const prices = JSON.parse(market.outcomePrices).map(Number);
          const yes = prices[outcomes.indexOf("Yes")];
          if (!Number.isFinite(yes)) throw new Error("no Yes price");
          return { question: market.question, yes, url: `https://polymarket.com/event/${event}` };
        })
      );
      const markets = results.filter((r) => r.status === "fulfilled").map((r) => r.value);
      if (markets.length === 0) throw new Error("no markets loaded");
      const avgYes = markets.reduce((sum, m) => sum + m.yes, 0) / markets.length;
      return {
        score: subScore(avgYes, BOUNDS.polymarket),
        headline: `Average "Yes" chance: ${(avgYes * 100).toFixed(1)}%`,
        details: `<ul>${markets
          .map((m) => `<li><a href="${m.url}" target="_blank" rel="noopener">${escapeHtml(m.question)}</a>: ${(m.yes * 100).toFixed(1)}%</li>`)
          .join("")}</ul>
          <p class="meta">${markets.length} of ${POLYMARKET_MARKETS.length} markets loaded. Calm = 5%, Frothy = 50%.</p>`,
      };
    }

    // Signal 2: OpenRouter. Prices are USD per token; free and special models (price ≤ 0) are skipped.
    async function loadOpenRouter() {
      const { data } = await getJson("https://openrouter.ai/api/v1/models");
      const now = Date.now() / 1000;
      const recent = [];
      const prior = [];
      for (const model of data) {
        const pricePerMillion = Number(model.pricing?.prompt) * 1e6;
        if (!(pricePerMillion > 0) || !model.created) continue;
        const ageDays = (now - model.created) / DAY_SECONDS;
        if (ageDays < 90) recent.push(pricePerMillion);
        else if (ageDays < 365) prior.push(pricePerMillion);
      }
      if (recent.length < 5 || prior.length < 5) throw new Error("too few models to compare");
      const recentMedian = median(recent);
      const priorMedian = median(prior);
      const ratio = recentMedian / priorMedian;
      const change = (ratio - 1) * 100;
      return {
        score: subScore(ratio, BOUNDS.openrouter),
        headline: `New models launch ${Math.abs(change).toFixed(0)}% ${change < 0 ? "cheaper" : "pricier"}`,
        details: `<ul>
            <li>Released in the last 90 days: median $${recentMedian.toFixed(2)} per million input tokens (${recent.length} paid models)</li>
            <li>Released 90–365 days ago: median $${priorMedian.toFixed(2)} (${prior.length} paid models)</li>
          </ul>
          <p class="meta">Ratio ${ratio.toFixed(2)}. Calm = 1.2 (prices up 20%), Frothy = 0.6 (prices down 40%).</p>
          <p class="note">Falling prices can also reflect efficiency gains, so this signal is directional, not definitive.</p>`,
      };
    }

    // Signal 3: hand-entered, no network call.
    async function loadManual() {
      const { value, quarter, source, history } = MANUAL_SIGNAL;
      return {
        score: subScore(value, BOUNDS.manual),
        headline: `${value}% of global VC funding · ${escapeHtml(source)}, ${escapeHtml(quarter)}`,
        details: `<ul>
            <li>${escapeHtml(quarter)}: ${value}% (current)</li>
            ${history.map((h) => `<li>${escapeHtml(h.quarter)}: ${h.approx ? "~" : ""}${h.value}%</li>`).join("")}
          </ul>
          <p class="meta">Source: ${escapeHtml(source)}, ${escapeHtml(quarter)}. Calm = 20%, Frothy = 80%. Entered by hand; update MANUAL_SIGNAL in app/index.html each quarter.</p>`,
      };
    }

    const SIGNALS = [
      { id: "polymarket", name: "Polymarket AI-hype odds", load: loadPolymarket },
      { id: "openrouter", name: "OpenRouter model price trend", load: loadOpenRouter },
      { id: "manual", name: MANUAL_SIGNAL.label, load: loadManual },
    ];

    // Gauge drawing: score 0 is the left end of the semicircle, 100 the right end.
    function pointOnArc(score, radius = 120) {
      const angle = Math.PI * (1 - score / 100);
      return [150 + radius * Math.cos(angle), 150 - radius * Math.sin(angle)];
    }

    function drawBands() {
      let start = 0;
      document.getElementById("bands").innerHTML = BANDS.map((band) => {
        const [x1, y1] = pointOnArc(start);
        const [x2, y2] = pointOnArc(band.max);
        start = band.max;
        return `<path d="M ${x1} ${y1} A 120 120 0 0 1 ${x2} ${y2}" style="stroke: ${band.color}" />`;
      }).join("");
    }

    function renderCard(signal, result) {
      const card = document.getElementById(`signal-${signal.id}`);
      if (result.status === "fulfilled") {
        const { score, headline, details } = result.value;
        card.innerHTML = `<summary><span><span class="signal-name">${escapeHtml(signal.name)}</span><br><span class="meta">${headline}</span></span>
            <span class="signal-score" style="color: ${bandFor(score).color}">${Math.round(score)}</span></summary>
          <div class="signal-body">${details}</div>`;
      } else {
        card.innerHTML = `<summary><span><span class="signal-name">${escapeHtml(signal.name)}</span><br><span class="meta">Unavailable</span></span>
            <span class="signal-score">–</span></summary>
          <div class="signal-body"><p class="meta">Could not load this signal (${escapeHtml(result.reason?.message || "unknown error")}). It is left out of the score.</p></div>`;
      }
    }

    async function main() {
      drawBands();
      document.getElementById("signals").innerHTML = SIGNALS.map(
        (s) => `<details id="signal-${s.id}"><summary><span class="signal-name">${escapeHtml(s.name)}</span><span class="meta">Loading…</span></summary></details>`
      ).join("");

      const results = await Promise.allSettled(SIGNALS.map((s) => s.load()));
      SIGNALS.forEach((s, i) => renderCard(s, results[i]));

      const scores = results.filter((r) => r.status === "fulfilled").map((r) => r.value.score);
      const average = scores.reduce((sum, s) => sum + s, 0) / scores.length;
      const froth = Math.round(average);
      const band = bandFor(froth);
      document.getElementById("score").textContent = froth;
      document.getElementById("band").textContent = band.name;
      document.getElementById("band").style.color = band.color;
      document.getElementById("needle").style.transform = `rotate(${(froth / 100) * 180}deg)`;
      document.getElementById("coverage").textContent =
        `${scores.length} of ${SIGNALS.length} signals loaded · ${new Date().toLocaleString()}`;
    }

    main();
  </script>
</body>
</html>
