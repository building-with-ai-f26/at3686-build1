# Daily refresh of the "Capitol Hill AI trades" summary.
# Writes AGGREGATES ONLY to docs/data/ (Bargo's terms forbid republishing raw
# trade records) and commits to main only when the data changed, which
# redeploys GitHub Pages.
name: Update Congress AI trades summary

on:
  schedule:
    - cron: "17 13 * * *" # daily, 13:17 UTC (8:17 AM New York in winter)
  workflow_dispatch: # "Run workflow" button on the Actions tab

# No permissions by default; the one job below asks only for what it needs.
permissions: {}

concurrency:
  group: congress-trades
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to commit the updated JSON; nothing else
    steps:
      # Actions are pinned to exact commits (a tag can be moved; a commit can't).
      # To update: look up the new release's commit on GitHub and change both parts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build summary
        run: node scripts/update-congress-summary.mjs
        env:
          # Optional free key from https://www.bargo.ai/free-apis/dash, stored as a
          # repository secret. It is never written to the page or the repo.
          BARGO_API_KEY: ${{ secrets.BARGO_API_KEY }}

      - name: Commit if changed
        run: |
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Congress AI trades summary"
          git push
